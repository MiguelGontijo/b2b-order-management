services:
  # 1. Banco Relacional (Transacional / ACID)
  postgres:
    image: postgres:16-alpine
    container_name: b2b-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: b2b_orders_db
    ports:
      - "5435:5432"
    networks:
      - b2b-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d b2b_orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Banco NoSQL (Dead Letter Queue - Resiliência)
  mongodb:
    image: mongo:7.0
    container_name: b2b-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
    ports:
      - "27017:27017"
    networks:
      - b2b-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Mensageria (Kafka em modo KRaft - Sem Zookeeper)
  kafka:
    image: apache/kafka:3.7.0
    container_name: b2b-kafka
    environment:
      # Configurações KRaft (a imagem apache/kafka lê variáveis KAFKA_*)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT (9092) para quem está na rede do compose; EXTERNAL (9094) para a máquina host
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Simulação de ambiente dev (um único broker)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9094:9094" # Acesso a partir da máquina host (ex.: ./mvnw spring-boot:run)
    networks:
      - b2b-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # 4. Aplicação Spring Boot
  app:
    build: .
    container_name: b2b-order-management
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/b2b_orders_db
      SPRING_MONGODB_URI: mongodb://admin:admin_password@mongodb:27017/b2b_orders_db?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks:
      - b2b-network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  b2b-network:
    driver: bridge
